<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MatsuTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="defs"></svg>

  <aside class="rail" id="rail"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="main" id="main"></main>
  <aside class="aside" id="aside"></aside>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<script src="js/core.js"></script>

    import {
      getAnalytics,

    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6Kbxd3-dbclNq0tf3te7MzqAvX9AXkWA",
      authDomain: "matsutalk-77424.firebaseapp.com",
      projectId: "matsutalk-77424",
      storageBucket: "matsutalk-77424.firebasestorage.app",
      messagingSenderId: "742140786055",
      appId: "1:742140786055:web:d75f7d04ffaf9481988f22",
      measurementId: "G-1F80QTT5YC"
    };

    try {
      const app = initializeApp(firebaseConfig);
      document.getElementById("firebase-status").textContent =
        "Firebase initialized successfully!";

      if (await isSupported()) {
        getAnalytics(app);
        console.log("Firebase Analytics initialized.");
      }
    } catch (error) {
      console.error("Firebase error:", error);
      document.getElementById("firebase-status").textContent =
        "Firebase error: " + error.message;
    }

</script>
